<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Séances et playlists partagées — BeatOnStep</title>
  <meta name="description" content="Consultez les cartes de défis sportifs validés et découvrez les séances musicales et playlists BeatOnStep.">
  <meta property="og:title" content="Partages BeatOnStep — Séances et playlists">
  <meta property="og:description" content="Des séances musicales et Run Mix à découvrir et importer.">
  <meta property="og:image" content="https://beatonstep.app/assets/brand/logo-400.jpg">
  <meta name="theme-color" content="#0a0a08">
  <link rel="icon" href="assets/brand/logo-400.jpg">
  <link rel="stylesheet" href="/sport-card-face.css">
  <style>
    :root {color-scheme:dark; --bg:#0a0a08;--panel:#171711;--border:#353429;--text:#f4f1e0;--muted:#b7b3a3;--yellow:#fcea07}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100% - 32px,820px);margin:22px auto 55px}
    a{color:inherit} a:hover{color:var(--yellow)}
    header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}
    .brand{font-weight:800;text-decoration:none;display:flex;align-items:center;gap:10px;font-size:20px}
    .brand img{width:36px;height:36px;border-radius:9px}
    .community-link{display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-weight:600;font-size:12px;text-decoration:none;white-space:nowrap;border:1px solid transparent;border-radius:999px;padding:7px 9px}
    .community-icon{width:23px;height:23px;display:block;flex:none}
    @media(max-width:600px){.community-link{width:44px;height:44px;padding:8px;border-color:var(--border)}.community-icon{width:27px;height:27px}.community-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}}
    header .lang{margin-left:auto;flex-shrink:0}
    .community-link:hover{color:var(--text);border-color:var(--border)}
    .community-link:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
    .lang button,.pagination button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 14px;cursor:pointer;font:inherit}
    .filter-picker{display:flex;align-items:center;flex:0 1 170px;min-width:0}
    .filter-picker select{appearance:auto;width:100%;min-width:0;border:1px solid var(--border);border-radius:24px;background:var(--panel);color:var(--text);padding:9px 12px;font:inherit;font-size:13px;cursor:pointer}
    .filter-picker input{width:100%;min-width:0;border:1px solid var(--border);border-radius:24px;background:var(--panel);color:var(--text);padding:9px 12px;font:inherit;font-size:13px}
    .filter-picker select:focus-visible,.filter-picker input:focus-visible,summary:focus-visible,.card-title:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
    .filter-picker[hidden]{display:none!important}
    .lang button[aria-pressed=true]{background:var(--yellow);color:#151510;border-color:var(--yellow)}
    h1{font-size:clamp(28px,6vw,36px);letter-spacing:-.035em;margin:0 0 5px;line-height:1.15}
    .sub{color:var(--muted);font-size:14px;line-height:1.4;margin:0 0 14px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 16px}
    .pagination,.details-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .filter-picker label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    #results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    #results>.card{margin:0;min-width:0}
    #results .share-summary{min-height:285px;display:flex;flex-direction:column}
    #results .share-tree{flex:1}
    #results .collection-art{height:125px}
    #results .card-stats{margin-top:auto}
    .card{background:radial-gradient(ellipse at 100% 0%,#292618 0%,#171711 55%);border:1px solid #403b2c;border-radius:20px;margin:12px 0;padding:14px;box-shadow:0 8px 28px #00000024}
    .card h2{font-size:clamp(19px,4.8vw,22px);margin:13px 0 10px;font-weight:750;line-height:1.3;overflow-wrap:anywhere}
    .card-head,.card-stats{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .card-head{color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
    .card-head-right{display:inline-flex;align-items:center;gap:9px;flex-shrink:0}
    .share-source-logo{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none}
    .source-logo{display:block;width:22px;height:22px;object-fit:contain}
    .source-logo-fallback{color:var(--muted);font-size:12px;font-weight:750}
    .card-stats{justify-content:flex-start;color:var(--muted);font-size:14px;gap:16px}
    .card-stats span{display:inline-flex;align-items:center;gap:6px}
    .stat-duration::before{content:'◷';font-size:18px;line-height:1}
    .stat-tracks::before{content:'♫';font-size:18px;line-height:1}
    .card-stats .stat-imports{color:#c0bbaa;gap:4px;font-variant-numeric:tabular-nums}
    .card-stats .stat-imports-icon{font-size:16px;line-height:1;color:#a8a396;transform:translateY(-1px)}
    .card-owner{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;margin:0 0 8px;letter-spacing:.015em}
    .card-owner svg{width:16px;height:16px;flex:none;color:var(--yellow)}
    .card-owner.unclaimed svg{color:var(--muted)}
    .card{transition:box-shadow .25s ease,transform .25s ease;position:relative;overflow:hidden}
    .card::before{content:'';pointer-events:none;position:absolute;inset:-80% auto auto -70%;width:45%;height:220%;transform:rotate(24deg);background:linear-gradient(90deg,transparent,#fff8c012,transparent)}
    .card:hover{box-shadow:0 12px 38px #0008,0 0 0 1px #d8bb3b44}
    .focus-stage.focus-enter .card{animation:collector-arrival 580ms cubic-bezier(.2,.9,.25,1) both}
    @keyframes collector-arrival{0%{opacity:.15;transform:perspective(800px) rotateY(-34deg) scale(.92)}65%{opacity:1;transform:perspective(800px) rotateY(8deg) scale(1.02)}100%{transform:perspective(800px) rotateY(0deg) scale(1)}}
    @media(prefers-reduced-motion:reduce){.card,.focus-stage.focus-enter .card{transition:none;animation:none}}
    .card-origin{font-size:13px;color:var(--muted);margin:0 0 14px}
    .card-origin a{color:var(--yellow);text-decoration:none}
    details.share-tree>summary,details.phase-branch>summary{list-style:none;cursor:pointer}
    details.share-tree>summary::-webkit-details-marker,details.phase-branch>summary::-webkit-details-marker{display:none}
    .share-summary{background:linear-gradient(145deg,#242319,#1c1c17 62%);border:1px solid #60583a;border-radius:14px;padding:16px 44px 16px 16px;position:relative;transition:background-color .2s,border-color .2s,box-shadow .2s}
    .share-summary:hover{border-color:#d2c14a;box-shadow:inset 0 0 0 1px #615823}
    .share-summary::after{content:'';position:absolute;right:23px;top:50%;width:10px;height:10px;border-right:2px solid var(--yellow);border-bottom:2px solid var(--yellow);transform:translateY(-65%) rotate(45deg);transition:transform .2s}
    .share-tree[open]>.share-summary{border-color:var(--yellow);box-shadow:inset 0 0 0 1px #645a23}
    .share-tree[open]>.share-summary::after{transform:translateY(-25%) rotate(225deg)}
    /* Collectible visual language: no account, rarity or ownership claims. */
    .collection-identity{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
    .collection-brand{color:#e3ddbb;font-weight:750;letter-spacing:.13em}
    .collection-number{color:#b0a887;font-variant-numeric:tabular-nums}
    .badge{border:1px solid #786f3c;border-radius:999px;padding:5px 10px;color:var(--yellow);font-size:10px;font-weight:750;letter-spacing:.11em}
    .collection-art{height:82px;margin-top:12px;position:relative;overflow:hidden;border:1px solid #46402a;border-radius:11px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 52% 100%,#48422080,transparent 58%),linear-gradient(120deg,#272517,#151610 60%,#1e1d14)}
    .collection-art::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 24px,#fcea0714 25px,#fcea0714 26px,transparent 27px),linear-gradient(transparent 70%,#fcea070b);pointer-events:none}
    .collection-art--music{background:radial-gradient(ellipse at 48% 100%,#283d4c91,transparent 62%),linear-gradient(120deg,#19232b,#141510 65%,#1b2020);border-color:#384b4d}
    .collection-glyph{font-weight:800;font-size:64px;line-height:1;transform:translateY(-2px);color:#fcea07;text-shadow:0 0 35px #fcea0740}
    .collection-art--music .collection-glyph{color:#9ad4eb;text-shadow:0 0 35px #83c3db70}
    .collection-art-label{position:absolute;bottom:7px;left:12px;color:#c8c09a;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    .collection-art--music .collection-art-label{color:#b6cdd6}
    .effort-graph{position:absolute;left:17px;right:17px;top:11px;bottom:21px;display:flex;align-items:flex-end;gap:3px}
    .effort-graph::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0,transparent 32%,#e5d7691c calc(32% + 1px),transparent calc(32% + 2px));pointer-events:none}
    .effort-segment{position:relative;z-index:1;flex-basis:0;min-width:3px;max-height:100%;background:linear-gradient(180deg,#fcea07,#a68d25);border-radius:3px 3px 0 0;box-shadow:0 0 14px #fcea071d}
    .effort-segment--unknown{background:repeating-linear-gradient(135deg,#737568 0 4px,#494b43 4px 8px);box-shadow:none;opacity:.5}
    .collection-art--effort{background:linear-gradient(180deg,#272519,#14140e);border-color:#5e5735}
    .tree-content{padding:12px 5px 0}
    .sport-card .sport-summary{cursor:pointer;-webkit-tap-highlight-color:transparent}
    .sport-card .sport-summary:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
    .sport-card .collection-art{background:radial-gradient(ellipse at 50% 100%,#61532b91,transparent 65%),linear-gradient(130deg,#2b281a,#161710);border-color:#776532}
    .sport-card .collection-glyph{font-size:55px}
    .sport-ownership{font-size:14px;color:#dfd9bc;margin:12px 0 4px}
    .sport-ownership strong{color:var(--yellow)}
    .sport-difficulty{font-size:12px;color:var(--muted);margin:5px 0}
    .sport-warning{display:inline-flex;align-items:center;gap:6px;border:1px solid #94783d;background:#413117;border-radius:9px;padding:7px 10px;color:#ffd990;font-size:12px;font-weight:700;margin:10px 0 0}
    .sport-details{margin-top:14px;border:1px solid #625a3d;border-radius:14px;background:#1d1d18;overflow:hidden}
    .sport-details>summary{padding:12px 14px;cursor:pointer;color:var(--yellow);font-weight:650;list-style-position:inside}
    .sport-detail-content{padding:0 15px 15px;font-size:13px;line-height:1.6}
    .sport-detail-content p{margin:7px 0}
    .sport-timeline{list-style:none;margin:12px 0 0;padding:0 0 0 15px;border-left:2px solid #696039}
    .sport-timeline li{position:relative;padding:0 0 15px 14px;color:#d9d4c3}
    .sport-timeline li::before{content:'';position:absolute;left:-20px;top:7px;background:var(--yellow);width:8px;height:8px;border-radius:50%}
    .sport-date{display:block;color:var(--muted);font-size:11px}
    /* Reading a shared workout: session > phase cards > songs, never an editor. */
    .tree-content--workout{padding:12px 4px 0}
    .workout-phases{padding:14px 13px 16px;border:1px solid #665c38;border-radius:16px;background:linear-gradient(180deg,#242319,#1b1b15);box-shadow:inset 0 1px 0 #ffffff08}
    .workout-phases-head{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;padding:0 3px 12px;border-bottom:1px solid #47412d}
    .workout-phases-title{margin:0;font-size:15px;font-weight:750;line-height:1.35}
    .workout-phases-count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
    .phase-list{position:relative;display:grid;gap:10px;padding:12px 0 0 15px}
    .phase-list::before{content:'';position:absolute;left:6px;top:30px;bottom:29px;width:2px;background:linear-gradient(#8a7937,#524d36);opacity:.75;pointer-events:none}
    .share-tree[open]>.tree-content{animation:details-in 190ms cubic-bezier(.2,.8,.2,1) both}
    @keyframes details-in{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
    .focus-dialog{width:min(620px,calc(100vw - 18px));max-height:min(92dvh,920px);box-sizing:border-box;overflow:auto;overscroll-behavior:contain;padding:12px;background:#11110e;border:1px solid #625b39;border-radius:22px;color:var(--text);box-shadow:0 25px 85px #000b}
    .focus-dialog::backdrop{background:rgba(0,0,0,.83);backdrop-filter:blur(5px)}
    .focus-toolbar{display:flex;align-items:center;justify-content:center;gap:10px;position:sticky;top:-12px;z-index:5;background:#11110ef2;padding:8px 3px 12px}
    .focus-toolbar button{display:grid;place-items:center;flex:none;width:42px;height:42px;background:#232219;border:1px solid #5a5336;border-radius:50%;color:#fcea07;font-size:23px;cursor:pointer}
    .focus-toolbar button:disabled{opacity:.3;cursor:default}
    .focus-toolbar button:not(:disabled):hover{background:#37321d}
    .focus-toolbar button:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
    .focus-position{color:var(--muted);font-size:13px;min-width:68px;text-align:center;font-variant-numeric:tabular-nums}
    .focus-close{margin-left:auto!important}
    .focus-stage{touch-action:pan-y}
    .focus-stage .card{margin:0}
    .focus-stage.focus-enter{animation:focus-enter 200ms cubic-bezier(.2,.8,.2,1) both}
    .focus-stage.focus-from-left{animation:focus-from-left 185ms cubic-bezier(.2,.8,.2,1) both}
    .focus-stage.focus-from-right{animation:focus-from-right 185ms cubic-bezier(.2,.8,.2,1) both}
    @keyframes focus-enter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
    @keyframes focus-from-left{from{opacity:.3;transform:translateX(-22px)}to{opacity:1;transform:none}}
    @keyframes focus-from-right{from{opacity:.3;transform:translateX(22px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.share-tree[open]>.tree-content,.focus-stage.focus-enter,.focus-stage.focus-from-left,.focus-stage.focus-from-right{animation:none}}
    .phase-branch{position:relative;margin:0;border:1px solid #55503d;border-radius:13px;background:#26251c;min-width:0}
    .phase-branch::before{content:'';position:absolute;left:-19px;top:22px;width:10px;height:10px;border-radius:50%;background:#373526;border:2px solid #9d9055;box-shadow:0 0 0 3px #211f17;z-index:1}
    .phase-branch[open]{border-color:#b9a73e;background:#2b291e}
    .phase-branch[open]::before{background:var(--yellow);border-color:var(--yellow)}
    .phase-branch>summary{padding:12px 37px 13px 12px;position:relative;border-radius:13px}
    .phase-branch>summary:hover{background:#ffffff08}
    .phase-branch>summary::after{content:'›';position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--yellow);font-size:23px}
    .phase-branch[open]>summary::after{content:'⌄'}
    .phase-heading{display:flex;align-items:center;gap:9px;min-width:0}
    .phase-number{display:inline-flex;align-items:center;justify-content:center;flex:none;width:27px;height:27px;border:1px solid #756a3b;border-radius:50%;background:#383424;color:#e4dca8;font-size:12px;font-weight:750;font-variant-numeric:tabular-nums}
    .phase-branch[open] .phase-number{background:var(--yellow);border-color:var(--yellow);color:#17160a}
    .phase-name{font-size:15px;font-weight:700;overflow-wrap:anywhere}
    .phase-meta{margin:6px 0 0 36px;color:var(--muted);font-size:13px;display:flex;gap:5px 12px;flex-wrap:wrap}
    .phase-meta .phase-bpm{color:var(--yellow)}
    .phase-songs{margin:0 12px 12px 48px;padding:2px 12px 7px;border-left:2px solid #73663a;border-radius:0 9px 9px 0;background:#15161188}
    .track{padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
    .track:last-child{border:0}
    .track small{display:block;color:var(--muted);margin-top:4px}
    .track-play{color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:550}
    .track-play::before{content:'▶';font-size:10px;color:var(--yellow)}
    .track-play:hover{text-decoration:underline;color:var(--yellow)}
    .card-actions{display:flex;justify-content:flex-end;padding:10px 0 0}
    summary:focus-visible,.track-play:focus-visible,.primary:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
    .primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;max-width:100%;border:0;background:var(--yellow);color:#17160a;border-radius:999px;padding:9px 15px;font:inherit;font-size:13px;font-weight:750;text-decoration:none;cursor:pointer;text-align:center}
    .primary:hover{background:#fff34a;color:#17160a}
    .import-icon{font-size:19px;font-weight:600;line-height:1}
    .back{display:inline-block;margin:0 0 13px;color:var(--muted);font-size:14px;text-decoration:none}
    .back:hover{text-decoration:underline}
    .back[hidden]{display:none}
    .site-footer{display:flex;align-items:center;flex-wrap:wrap;gap:14px 20px;margin-top:38px;padding:18px 0;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
    .site-footer .foot-link{display:inline-flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none}
    .site-footer .foot-link:hover{color:var(--yellow)}
    .site-footer .ico{width:17px;height:17px;flex:none}
    .site-footer .foot-link:focus-visible{outline:2px solid var(--yellow);outline-offset:4px}
    .pagination{justify-content:center;margin-top:24px}
    button:disabled{opacity:.4;cursor:default}
    .error{padding:20px;border:1px solid var(--border);border-radius:16px;color:var(--muted)}
    @media(max-width:600px){
      #results{grid-template-columns:minmax(0,1fr);gap:14px}
      #results .share-summary{min-height:295px}
      #results .sport-summary{min-height:275px}
      .filter-picker input{padding:9px 7px}
      #results .collection-art{height:148px}
      main{margin-top:18px}
      header{margin-bottom:16px;gap:7px}
      .brand{font-size:17px;gap:7px}
      .brand img{width:30px;height:30px}
      .community-link{padding:7px 5px;font-size:11px}
      .back{margin-bottom:10px}
      .lang button{padding:8px 11px;font-size:13px}
      .toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0 15px}
      .filter-picker{width:100%;min-width:0}
      .filter-picker select{padding:9px 7px;font-size:13px;text-overflow:ellipsis}
      .card{padding:12px}
      .share-summary{padding:14px 40px 15px 14px}
      .share-summary::after{right:17px}
      .collection-art{height:74px}
      .collection-glyph{font-size:56px}
      .tree-content{padding:12px 4px 0}
      .tree-content--workout{padding:10px 0 0}
      .workout-phases{padding:11px 8px 13px;border-radius:13px}
      .workout-phases-head{padding:0 2px 10px}
      .workout-phases-title{font-size:14px}
      .phase-list{padding-left:11px;gap:8px}
      .phase-list::before{left:4px}
      .phase-branch::before{left:-14px;top:21px;width:8px;height:8px}
      .phase-branch>summary{padding:11px 28px 12px 9px}
      .phase-branch>summary::after{right:9px}
      .phase-heading{gap:7px}
      .phase-number{width:23px;height:23px;font-size:11px}
      .phase-name{font-size:14px}
      .phase-meta{margin-left:30px;gap:5px 9px;font-size:12px}
      .phase-songs{margin:0 8px 10px 24px;padding:3px 8px 7px}
      .track{font-size:13px}
      .primary{width:auto}
      .site-footer{justify-content:center;gap:18px 22px}
      .site-footer .foot-label{display:none}
      .site-footer .ico{width:19px;height:19px}
    }
  </style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="./"><img src="assets/brand/logo-400.jpg" alt="">BeatOnStep</a>
    <div class="lang"><button type="button" id="fr" aria-pressed="true">FR</button><button type="button" id="en" aria-pressed="false">EN</button></div>
    <a class="community-link" href="compte.html" id="community-link" aria-label="Profil" title="Profil">

<script src="/sport-card-face.js"></script>
<script>
(function(){
  'use strict';
  const API='/api/shared';
  const SPORT_API='/api/sport/cards';
  const params=new URLSearchParams(location.search);
  const parsedId=params.get('id');
  const id=parsedId && /^[1-9]\d{0,14}$/.test(parsedId) ? Number(parsedId) : null;
  const parsedSport=params.get('sport');
  const sportId=!id&&parsedSport&&/^[1-9]\d{0,14}$/.test(parsedSport)?Number(parsedSport):null;
  // Run Mix keeps its historic direct ?id= URL, but no discovery tab.
  const VALID_KINDS=['workout','challenge'];
  const VALID_SOURCES=['all','spotify','apple','deezer','youtube','amazon'];
  let lang=(navigator.language||'fr').toLowerCase().startsWith('fr')?'fr':'en';
  let kind=VALID_KINDS.includes(params.get('kind'))?params.get('kind'):'challenge';
  let sportDistance='all',sportDifficulty='all',sportSub='';
  let musicGoal=['all','time','distance'].includes(params.get('goal'))?
    params.get('goal'):'all';
  let musicSource=VALID_SOURCES.includes(params.get('source'))?params.get('source'):'all';
  let sort=['recent','popular'].includes(params.get('sort'))?params.get('sort'):'popular',page=1,listTicket=0;
  const cache=new Map();
  const sportCache=new Map();
  const countedViews=new Set();
  const $=key=>document.getElementById(key);
  const fr=(a,b)=>lang==='fr'?a:b;
  const el=(tag,cls,value)=>{
    const n=document.createElement(tag);
    if(cls)n.className=cls;
    if(value!==undefined)n.textContent=value;
    return n;
  };
  const duration=s=>{
    const seconds=Math.round(Number(s)||0);
    return seconds>=3600
      ?Math.floor(seconds/3600)+' h '+String(Math.floor(seconds%3600/60)).padStart(2,'0')
      :Math.max(1,Math.round(seconds/60))+' min';
  };
  const number=n=>Number(n||0).toLocaleString(lang==='fr'?'fr-FR':'en');
  const workoutDistance=meters=>{
    const km=Number(meters)/1000;
    return Number.isFinite(km)&&km>0
      ?km.toLocaleString(lang==='fr'?'fr-FR':'en',{maximumFractionDigits:2})+' km'
      :'—';
  };
  const source=s=>({apple:'Apple Music',spotify:'Spotify',deezer:'Deezer',
    youtube:'YouTube Music',amazon:'Amazon Music'})[s]||'BeatOnStep';
  const empty=node=>node.replaceChildren();
  async function get(url){
    const response=await fetch(url);
    if(!response.ok)throw Error('not_found');
    return response.json();
  }
  function getSportDetail(cardId){
    if(!sportCache.has(cardId)){
      sportCache.set(cardId,get(SPORT_API+'/'+cardId).catch(error=>{
        sportCache.delete(cardId);throw error;
      }));
    }
    return sportCache.get(cardId);
  }
  function getDetail(id){
    if(!cache.has(id)){
      const load=get(API+'/'+id).catch(error=>{
        cache.delete(id);
        throw error;
      });
      cache.set(id,load);
    }
    return cache.get(id);
  }
  function musicLink(song,source){
    const title=String(song.n||'').trim();
    const artist=String(song.a||'').trim();
    const id=String(song.i||'').trim();
    const query=encodeURIComponent([title,artist].filter(Boolean).join(' '));
    // Provider-hosted URLs only. Never build a playable audio stream or trust
    // arbitrary user-supplied URLs from a public share's JSON payload.
    if(source==='spotify' && /^[a-zA-Z0-9]{22}$/.test(id))
      return {url:'https://open.spotify.com/track/'+id,direct:true};
    if(source==='deezer' && /^[0-9]{1,20}$/.test(id))
      return {url:'https://www.deezer.com/track/'+id,direct:true};
    if(source==='youtube' && /^[a-zA-Z0-9_-]{11}$/.test(id))
      return {url:'https://music.youtube.com/watch?v='+id,direct:true};
    if(source==='apple'){
      const trusted=String(song.url||'').trim();
      if(/^https:\/\/music\.apple\.com\/[^\s]*$/i.test(trusted))
        return {url:trusted,direct:true};
      // Apple catalog IDs without storefront: ask Apple Music to resolve them
      // through search instead of assuming a valid region-specific song URL.
      return {url:'https://music.apple.com/search?term='+query,direct:false};
    }
    const searches={
      spotify:'https://open.spotify.com/search/',
      deezer:'https://www.deezer.com/search/',
      youtube:'https://music.youtube.com/search?q=',
      amazon:'https://music.amazon.com/search/',
    };
    if(searches[source])return {url:searches[source]+query,direct:false};
    return null;
  }
  function songRows(body,item,phaseIndex){
    const tracks=item.payload&&item.payload.t;
    if(!Array.isArray(tracks))throw Error('invalid_tracks');
    const songs=item.kind==='workout'
      ?tracks.filter(song=>song.p===phaseIndex):tracks;
    if(!songs.length){
      body.append(el('p','sub',fr('Aucune musique sélectionnée','No selected tracks')));
      return;
    }
    songs.forEach((raw,index)=>{
      const song=item.kind==='workout'
        ?raw:{n:raw[1],a:raw[2],b:raw[4],i:raw[0],url:raw[7]};
      const row=el('div','track');
      const link=musicLink(song,item.source);
      if(link){
        const a=el('a','track-play',song.n);
        a.href=link.url;
        a.target='_blank';
        a.rel='noopener noreferrer';
        a.title=link.direct
          ?fr('Ouvrir et écouter sur ','Open and listen on ')+source(item.source)
          :fr('Rechercher sur ','Search on ')+source(item.source);
        a.setAttribute('aria-label',a.title+' : '+song.n);
        row.append(a);
      }else row.append(el('span','',song.n));
      const caption=[song.a,song.b?Math.round(song.b)+' BPM':'',
        link&&!link.direct?fr('Recherche','Search'):null].filter(Boolean).join(' · ');
      if(caption)row.append(el('small','',caption));
      body.append(row);
    });
  }
  function phaseTree(body,item){
    const phases=item.payload&&item.payload.p;
    if(!Array.isArray(phases))throw Error('invalid_phases');
    // One clearly delimited read-only group inside the parent session card.
    const panel=el('section','workout-phases');
    panel.setAttribute('aria-label',fr('Phases de la séance','Workout phases'));
    const heading=el('div','workout-phases-head');
    heading.append(el('h3','workout-phases-title',fr('Phases de la séance','Workout phases')),
      el('span','workout-phases-count',number(phases.length)+' '+fr('phases','phases')));
    const list=el('div','phase-list');
    phases.forEach((phase,index)=>{
      const branch=el('details','phase-branch');
      const summary=el('summary','');
      const title=el('div','phase-heading');
      title.append(el('span','phase-number',String(index+1)),
        el('span','phase-name',phase[0]));
      summary.append(title);
      const stats=el('div','phase-meta');
      const count=item.payload.t.filter(song=>song.p===index).length;
      const distanceWorkout=item.goalMode==='distance' && item.payload.v===3;
      stats.append(el('span','',distanceWorkout?workoutDistance(phase[1]):duration(phase[1])),
        el('span','',number(count)+' '+(count===1?fr('titre','track'):fr('titres','tracks'))),
        el('span','phase-bpm',fr('BPM moy. ','Avg BPM ')+(phase[3]||'—')));
      summary.append(stats);
      const content=el('div','phase-songs');
      branch.append(summary,content);
      branch.addEventListener('toggle',()=>{
        if(!branch.open||branch.dataset.loaded==='yes')return;
        songRows(content,item,index);
        branch.dataset.loaded='yes';
      });
      list.append(branch);
    });
    panel.append(heading,list);
    body.append(panel);
  }
  // The existing workout graph shows target cadence (PPM).
  // Run Mix uses the *actual known BPM of songs*, never a fabricated target.
  // Both share the same compact visual language, but have distinct labels.
  function drawEffortProfile(art,item){
    const runMix=item.kind==='runmix';
    if(!runMix&&item.kind!=='workout')return;
    const phases=Array.isArray(item.profile)?item.profile:
      (!runMix&&item.payload&&item.payload.p);
    if(!Array.isArray(phases)||!phases.length||phases.length>32)return;
    const data=[];
    for(const phase of phases){
      if(!Array.isArray(phase))return;
      // Catalog profiles: [duration, BPM-or-PPM]; full workouts have
      // [name, duration, PPM target, music BPM].
      const compact=phase.length===2;
      const seconds=Number(compact?phase[0]:phase[1]);
      const rawTarget=compact?phase[1]:phase[2];
      const unknown=runMix&&rawTarget===null;
      const target=unknown?null:Number(rawTarget);
      if(!Number.isFinite(seconds)||seconds<=0||
          (!unknown&&(!Number.isFinite(target)||target<=0)))return;
      data.push({seconds,target});
    }
    const targets=data.filter(x=>x.target!==null).map(x=>x.target);
    if(!targets.length)return;
    const low=Math.min(...targets),high=Math.max(...targets);
    const baseline=Math.max(0,low-25);
    const ceiling=high+12;
    const graph=el('div','effort-graph');
    for(const phase of data){
      const bar=el('span','effort-segment'+
        (phase.target===null?' effort-segment--unknown':''));
      const height=phase.target===null?32:
        (runMix&&high===low?64:
          Math.max(20,Math.min(95,Math.round(22+73*(phase.target-baseline)/(ceiling-baseline)))));
      bar.setAttribute('style','height:'+height+'%;flex-grow:'+
        Math.min(86400,Math.round(phase.seconds)));
      graph.append(bar);
    }
    art.replaceChildren(graph,el('span','collection-art-label',
      runMix?fr('Profil BPM','BPM profile'):fr("Profil d'effort",'Effort profile')));
    art.className='collection-art collection-art--effort';
  }
  let catalogItems=[];
  let focusDialog=null,focusStage=null,focusPrevious=null,focusNext=null,focusPosition=null;
  let focusItems=[],focusIndex=0,focusReturn=null,swipeStart=null;
  function closeFocus(){
    if(!focusDialog)return;
    if(typeof focusDialog.close==='function')focusDialog.close();
    else focusDialog.removeAttribute('open');
  }
  function setupFocus(){
    if(focusDialog)return;
    focusDialog=el('dialog','focus-dialog');
    focusDialog.setAttribute('aria-modal','true');
    const toolbar=el('div','focus-toolbar');
    focusPrevious=el('button','', '←');
    focusNext=el('button','', '→');
    focusPosition=el('span','focus-position');
    const close=el('button','focus-close','×');
    for(const button of [focusPrevious,focusNext,close])button.type='button';
    toolbar.append(focusPrevious,focusPosition,focusNext,close);
    focusStage=el('div','focus-stage');
    focusDialog.append(toolbar,focusStage);
    document.body.append(focusDialog);
    focusPrevious.onclick=()=>changeFocus(-1);
    focusNext.onclick=()=>changeFocus(1);
    close.onclick=closeFocus;
    focusDialog.addEventListener('click',e=>{
      if(e.target===focusDialog)closeFocus();
    });
    focusDialog.addEventListener('keydown',e=>{
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
        e.preventDefault();
        changeFocus(e.key==='ArrowLeft'?-1:1);
      }
    });
    focusDialog.addEventListener('close',()=>{
      if(focusReturn&&typeof focusReturn.focus==='function')focusReturn.focus();
    });
    focusStage.addEventListener('touchstart',e=>{
      if(e.touches.length!==1)return;
      swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
    },{passive:true});
    focusStage.addEventListener('touchend',e=>{
      if(!swipeStart||!e.changedTouches.length)return;
      const dx=e.changedTouches[0].clientX-swipeStart.x;
      const dy=e.changedTouches[0].clientY-swipeStart.y;
      swipeStart=null;
      if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.35){
        if((dx<0&&focusIndex<focusItems.length-1)||(dx>0&&focusIndex>0)){
          e.preventDefault();
          changeFocus(dx<0?1:-1);
        }
      }
    },{passive:false});
    focusStage.addEventListener('touchcancel',()=>{swipeStart=null});
  }
  function renderFocus(direction=0){
    if(!focusStage||!focusItems.length)return;
    const item=focusItems[focusIndex];
    focusPosition.textContent=(focusIndex+1)+' / '+focusItems.length;
    focusPrevious.disabled=focusIndex===0;
    focusNext.disabled=focusIndex===focusItems.length-1;
    focusPrevious.setAttribute('aria-label',fr('Carte précédente','Previous card'));
    focusNext.setAttribute('aria-label',fr('Carte suivante','Next card'));
    focusDialog.querySelector('.focus-close').setAttribute('aria-label',fr('Fermer','Close'));
    focusDialog.setAttribute('aria-label',item.kind==='challenge'?sportName(item):item.name);
    const card=item.kind==='challenge'?createSportCard(item,false,true):createCard(item,false,true);
    focusStage.replaceChildren(card);
    const tree=card.querySelector('details.share-tree');
    if(tree)tree.open=true;
    focusStage.classList.remove('focus-enter','focus-from-left','focus-from-right');
    // Restart the fast transition for each card without animating the page scroll.
    void focusStage.offsetWidth;
    focusStage.classList.add(direction<0?'focus-from-left':direction>0?'focus-from-right':'focus-enter');
    focusDialog.scrollTop=0;
  }
  function changeFocus(direction){
    const next=focusIndex+direction;
    if(next<0||next>=focusItems.length)return;
    focusIndex=next;
    renderFocus(direction);
  }
  function openFocus(itemId,origin){
    const item=catalogItems.find(row=>row.id===itemId);
    if(!item)return;
    // A collection stays coherent: workout cards navigate other workouts,
    // playlist cards navigate other playlists in the current filtered page.
    focusItems=catalogItems.filter(row=>row.kind===item.kind);
    focusIndex=focusItems.findIndex(row=>row.id===itemId);
    focusReturn=origin;
    setupFocus();
    renderFocus();
    if(typeof focusDialog.showModal==='function')focusDialog.showModal();
    else focusDialog.setAttribute('open','');
    const close=focusDialog.querySelector('.focus-close');
    if(close&&typeof close.focus==='function')close.focus();
  }
  const difficultyLabels={
    beginner:['Débutant','Beginner'],amateur:['Amateur','Amateur'],
    regular:['Régulier','Regular'],intermediate:['Intermédiaire','Intermediate'],
    expert:['Expert','Expert'],legend:['Légende','Legend'],
    world_elite:['Élite mondiale','World elite'],
  };
  function sportDistanceLabel(cm){
    if(cm===40000)return '400 m';
    if(cm===2109750)return fr('Semi-marathon','Half marathon');
    if(cm===4219500)return fr('Marathon','Marathon');
    return number(cm/100000)+' km';
  }
  function sportSubLabel(value,unit){
    if(unit!=='second')return value+' min';
    const minutes=Math.floor(value/60),seconds=value%60;
    return minutes?(minutes+' min'+(seconds?' '+String(seconds).padStart(2,'0')+' s':'')):seconds+' s';
  }
  function sportName(item){
    return sportDistanceLabel(item.distanceCm)+' · SUB '+
      sportSubLabel(item.subValue,item.timeUnit);
  }
  const sportHandle=handle=>handle?'@'+handle:fr('Compte indisponible','Unavailable account');
  function sportPeriod(ms){
    if(!Number.isFinite(ms))return '—';
    const days=Math.floor(ms/86400000);
    if(days>=1)return days+' '+(days===1?fr('jour','day'):fr('jours','days'));
    const hours=Math.floor(ms/3600000);
    if(hours>=1)return hours+' h';
    return Math.max(0,Math.floor(ms/60000))+' min';
  }
  function sportDate(value){
    return Number.isFinite(value)
      ?new Date(value).toLocaleDateString(lang==='fr'?'fr-FR':'en-US'):'—';
  }
  function createSportCard(item,detailed,inFocus=false){
    const card=el('article','card sport-card');
    const summary=el('div','share-summary sport-summary');
    const head=el('div','card-head');
    const identity=el('span','collection-identity');
    identity.append(el('span','collection-brand','BeatOnStep'),
      el('span','collection-number','#'+item.id));
    head.append(identity,el('span','badge',fr('Défi','Challenge')));
    // One face for catalogue, account and sport-gift views.
    const face=BeatOnStepSportCards.createFace(document,{
      title:sportName(item),distanceCm:item.distanceCm,difficulty:item.difficulty,
    },lang);
    const copy=el('div','bos-sport-copy');
    const title=el('h2','',sportName(item));
    const level=difficultyLabels[item.difficulty]||null;
    const levelLabel=level?fr(level[0],level[1]):fr('Non précisée','Not specified');
    const difficulty=el('p','sport-difficulty',fr('Difficulté : ','Difficulty: ')+levelLabel);
    const owner=el('p','sport-ownership');
    owner.append(el('span','',fr('Détenteur actuel : ','Current holder: ')),
      el('strong','',item.owner?'@'+item.owner:fr('Réserve BeatOnStep','BeatOnStep reserve')));
    copy.append(head,title,difficulty,owner);
    summary.append(face,copy);
    if(item.performanceWarning===true)
      copy.append(el('p','sport-warning',
        fr('⚠ Performance non validée','⚠ Performance not validated')));
    if(!detailed&&!inFocus){
      summary.tabIndex=0;
      summary.setAttribute('role','button');
      summary.setAttribute('aria-label',fr('Voir la carte ','View card ')+sportName(item));
      summary.addEventListener('click',()=>openFocus(item.id,summary));
      summary.addEventListener('keydown',event=>{
        if(event.key==='Enter'||event.key===' '){event.preventDefault();openFocus(item.id,summary);}
      });
    }
    card.append(summary);
    const details=el('details','sport-details');
    const heading=el('summary','',fr('Historique des détenteurs','Holder history'));
    const content=el('div','sport-detail-content');
    details.append(heading,content);
    details.addEventListener('toggle',async()=>{
      if(!details.open||details.dataset.loaded==='yes'||details.dataset.loaded==='loading')return;
      details.dataset.loaded='loading';
      content.textContent=fr('Chargement…','Loading…');
      try{
        const full=await getSportDetail(item.id);
        empty(content);
        content.append(el('p','',fr('Premier détenteur : ','First holder: ')+
          sportHandle(full.firstHolder)));
        content.append(el('p','',fr('Plus longue possession : ','Longest holding: ')+
          sportHandle(full.longestHolder)+' · '+sportPeriod(full.longestHeldMs)));
        const timeline=el('ol','sport-timeline');
        for(const event of full.history||[]){
          const line=el('li','');
          const change=event.reason==='gift_claim'
            ?fr('Donation : ','Gift: ')+sportHandle(event.from)+' → '+sportHandle(event.to)
            :event.reason==='sport_win'
              ?fr('Gain sportif : ','Sports win: ')+sportHandle(event.to)
              :fr('Carte libérée','Card released');
          line.append(el('span','',change),el('span','sport-date',sportDate(event.at)));
          timeline.append(line);
        }
        if(!timeline.children.length)content.append(el('p','',
          fr('Aucun transfert enregistré.','No transfers recorded.')));
        else content.append(timeline);
        if(full.historyHasMore)content.append(el('p','',
          fr('Historique plus ancien non affiché.','Older history not displayed.')));
        details.dataset.loaded='yes';
      }catch(_){
        details.dataset.loaded='no';
        content.textContent=fr('Historique indisponible. Réessayez.','History unavailable. Please retry.');
      }
    });
    card.append(details);
    const footer=el('div','card-actions');
    const link=el('a','primary',fr('Voir la fiche','Open card'));
    link.href='partages.html?kind=challenge&sport='+item.id;
    link.setAttribute('aria-label',fr('Voir la fiche du défi ','Open challenge card ')+sportName(item));
    footer.append(link);
    card.append(footer);
    return card;
  }
  function createCard(item,detailed,inFocus=false){
    const card=el('article','card');
    const tree=el('details','share-tree');
    const summary=el('summary','share-summary');
    summary.title=fr('Afficher ou masquer le déroulé','Show or hide details');
    if(!detailed&&!inFocus){
      summary.addEventListener('click',event=>{
        event.preventDefault();
        openFocus(item.id,summary);
      });
    }
    const head=el('div','card-head');
    const identity=el('span','collection-identity');
    identity.append(el('span','collection-brand','BeatOnStep'),
      el('span','collection-number','#'+String(item.id>1_000_000_000_000
        ?item.id-1_000_000_000_000:item.id).padStart(4,'0')));
    const headRight=el('span','card-head-right');
    const distanceWorkout=item.kind==='workout' && item.goalMode==='distance';
    headRight.append(el('span','badge',item.kind!=='workout'
      ?fr('Playlist','Playlist')
      :distanceWorkout?fr('Distance','Distance'):fr('Durée','Time')));
    const provider=el('span','share-source-logo');
    provider.setAttribute('role','img');
    provider.setAttribute('aria-label',source(item.source));
    provider.title=source(item.source);
    if(['spotify','apple','deezer','youtube','amazon'].includes(item.source)){
      const logo=el('img','source-logo');
      logo.src='assets/music-services/'+item.source+'.svg';
      logo.alt='';
      logo.width=22;logo.height=22;
      provider.append(logo);
    }else provider.append(el('span','source-logo-fallback','♫'));
    headRight.append(provider);
    head.append(identity,headRight);
    const art=el('div',item.kind==='workout'?'collection-art':'collection-art collection-art--music');
    art.setAttribute('aria-hidden','true');
    art.append(el('span','collection-glyph',item.kind==='workout'?'↗':'♫'),
      el('span','collection-art-label',item.kind==='workout'
        ?fr('Course & musique','Run & music'):fr('Playlist musicale','Music playlist')));
    drawEffortProfile(art,item);
    const title=el('h2','',item.name);
    const stats=el('div','card-stats');
    const imports=el('span','stat-imports');
    const importCount=number(item.imports);
    imports.setAttribute('aria-label',fr(importCount+' importations',importCount+' imports'));
    imports.title=fr(importCount+' importations',importCount+' imports');
    const importGlyph=el('span','stat-imports-icon','⇩');
    importGlyph.setAttribute('aria-hidden','true');
    imports.append(importGlyph,el('span','',importCount));
    stats.append(el('span','stat-duration',
        distanceWorkout?workoutDistance(item.targetMeters):duration(item.durationSec)),
      el('span','stat-tracks',number(item.tracks)+' '+fr('titres','tracks')),imports);
    summary.append(head,art,title);
    if(item.kind==='workout' && Object.prototype.hasOwnProperty.call(item,'owner')){
      const owner=el('span','card-owner'+(item.owner?'':' unclaimed'));
      const ownerIcon=document.createElementNS('http://www.w3.org/2000/svg','svg');
      ownerIcon.setAttribute('viewBox','0 0 24 24');
      ownerIcon.setAttribute('fill','none');
      ownerIcon.setAttribute('stroke','currentColor');
      ownerIcon.setAttribute('stroke-width','1.8');
      ownerIcon.setAttribute('aria-hidden','true');
      const crown=document.createElementNS('http://www.w3.org/2000/svg','path');
      crown.setAttribute('d','M2 7l4.5 4 5.5-6 5.5 6L22 7l-2 12H4L2 7z');
      ownerIcon.append(crown);
      owner.append(ownerIcon,el('span','',item.owner?'@'+item.owner:fr('Réserve BeatOnStep','BeatOnStep reserve')));
      owner.setAttribute('aria-label',item.owner
        ?fr('Carte détenue par @','Card held by @')+item.owner
        :fr('Carte dans la réserve','Card in reserve'));
      summary.append(owner);
    } else if(typeof item.author==='string' && /^[a-z0-9][a-z0-9_.-]{2,23}$/.test(item.author)){
      const by=el('a','creator',fr('Par @','By @')+item.author);
      by.href='compte.html?profil='+encodeURIComponent(item.author);
      by.style.cssText='color:var(--yellow);font-weight:700;font-size:13px;text-decoration:none;display:inline-block;margin-bottom:10px';
      // A creator link opens the web profile, not the full-screen card carousel.
      by.addEventListener('click',event=>event.stopPropagation());
      summary.append(by);
    } else {
      summary.append(el('span','',fr('Partage anonyme','Anonymous share')));
    }
    summary.append(stats);
    const content=el('div',item.kind==='workout'?'tree-content tree-content--workout':'tree-content');
    tree.append(summary,content);
    tree.addEventListener('toggle',async()=>{
      if(!tree.open||['yes','loading'].includes(tree.dataset.loaded))return;
      tree.dataset.loaded='loading';
      content.textContent=fr('Chargement…','Loading…');
      try{
        const full=detailed?item:await getDetail(item.id);
        empty(content);
        if(item.kind==='workout' && Object.prototype.hasOwnProperty.call(full,'creator')){
          const creator=el('div','card-origin');
          creator.append(el('span','',fr('Créateur · ','Creator · ')));
          if(typeof full.creator==='string' && /^[a-z0-9][a-z0-9_.-]{2,23}$/.test(full.creator)){
            const link=el('a','', '@'+full.creator);
            link.href='compte.html?profil='+encodeURIComponent(full.creator);
            creator.append(link);
          } else creator.append(el('span','',fr('Anonyme','Anonymous')));
          content.append(creator);
        }
        if(item.kind==='workout')phaseTree(content,full);
        else songRows(content,full);
        drawEffortProfile(art,full);
        tree.dataset.loaded='yes';
      }catch(_){
        tree.dataset.loaded='no';
        content.textContent=fr('Détails indisponibles. Refermez puis réessayez.','Details unavailable. Close and try again.');
      }
    });
    card.append(tree);
    const footer=el('div','card-actions');
    const open=el('a','primary');
    const icon=el('span','import-icon','+');
    icon.setAttribute('aria-hidden','true');
    open.append(icon,el('span','',fr('Importer','Import')));
    open.href='beatonstep://shared?id='+item.id;
    open.setAttribute('aria-label',fr('Importer '+item.name+' dans BeatOnStep','Import '+item.name+' into BeatOnStep'));
    footer.append(open);
    card.append(footer);
    return card;
  }
  async function showList(){
    const request=++listTicket;
    const result=$('results'),paging=$('pages');
    empty(result);
    empty(paging);
    catalogItems=[];
    result.append(el('p','sub',fr('Chargement…','Loading…')));
    $('kind-filter').value=kind;
    $('sort-filter').value=sort;
    $('source-filter').value=musicSource;
    $('session-mode-filter').value=musicGoal;
    $('distance-filter').value=sportDistance;
    $('difficulty-filter').value=sportDifficulty;
    $('sub-filter').value=sportSub;
    try{
      const target=kind==='challenge'
        ?SPORT_API+'?distance='+encodeURIComponent(sportDistance)+
          '&difficulty='+encodeURIComponent(sportDifficulty)+
          (sportDistance!=='all'&&sportSub?'&sub='+encodeURIComponent(sportSub):'')+
          '&page='+page
        :API+'?kind=workout&goal='+encodeURIComponent(musicGoal)+'&source='+
          encodeURIComponent(musicSource)+'&sort='+sort+'&page='+page;
      const data=await get(target);
      if(request!==listTicket)return;
      empty(result);
      catalogItems=data.items;
      if(!data.items.length)result.append(el('p','error',kind==='challenge'
        ?fr('Aucune carte sportive validée pour ces critères.','No verified sport cards match these filters.')
        :fr('Aucun partage pour le moment.','No shares yet.')));
      data.items.forEach(x=>result.append(
        kind==='challenge'?createSportCard(x,false):createCard(x,false)));
      if(data.total>20){
        const previous=el('button','',fr('← Précédent','← Previous'));
        previous.disabled=page===1;
        previous.onclick=()=>{page--;showList()};
        const next=el('button','',fr('Suivant →','Next →'));
        next.disabled=page*20>=data.total;
        next.onclick=()=>{page++;showList()};
        paging.append(previous,el('span','',page+' / '+Math.ceil(data.total/20)),next);
      }
    }catch(_){
      if(request!==listTicket)return;
      empty(result);
      result.append(el('p','error',fr('Catalogue indisponible. Réessayez plus tard.','Catalog unavailable. Try again later.')));
    }
  }
  function updateCatalogFilters(){
    const sport=kind==='challenge';
    $('sort-picker').hidden=sport;
    $('source-picker').hidden=sport;
    $('session-mode-picker').hidden=sport;
    for(const name of ['distance-picker','difficulty-picker','sub-picker'])
      $(name).hidden=!sport;
    $('sub-filter').disabled=!sport||sportDistance==='all';
    $('sub-label').textContent=sportDistance==='40000'
      ?fr('SUB maximal (secondes)','Maximum SUB (seconds)')
      :fr('SUB maximal (minutes)','Maximum SUB (minutes)');
    $('sub-filter').placeholder=sportDistance==='40000'
      ?fr('SUB max. (s)','Max SUB (s)')
      :fr('SUB max. (min)','Max SUB (min)');
  }
  async function showDetail(){
    $('catalog').hidden=true;
    const target=$('detail');
    target.hidden=false;
    empty(target);
    target.append(el('p','sub',fr('Chargement du partage…','Loading share…')));
    try{
      const item=sportId?await getSportDetail(sportId):await getDetail(id);
      empty(target);
      target.append(sportId?createSportCard(item,true):createCard(item,true));
      document.title=(sportId?sportName(item):item.name)+' — BeatOnStep';
      // Viewing public sport cards never increments the musical import counter.
      if(!sportId&&!document.hidden && !countedViews.has(id)){
        countedViews.add(id);
        fetch(API+'/'+id+'/view',{method:'POST'}).catch(()=>{});
      }
    }catch(_){
      empty(target);
      target.append(el('p','error',fr('Ce partage est indisponible ou a expiré.','This share is unavailable or has expired.')));
    }
  }
  function setLanguage(next){
    lang=next;
    document.documentElement.lang=lang;
    $('fr').setAttribute('aria-pressed',String(lang==='fr'));
    $('en').setAttribute('aria-pressed',String(lang==='en'));
    $('back').hidden=!id&&!sportId;
    if(id||sportId){
      $('back').href=sportId?'partages.html?kind=challenge':'partages.html';
      $('back').textContent=fr('← Catalogue','← Catalog');
    }
    $('title').textContent=sportId?fr('Carte de défi','Challenge card'):
      id?fr('Partage BeatOnStep','BeatOnStep share'):fr('Catalogue','Catalog');
    $('community-link').querySelector('.community-label').textContent=fr('Profil','Profile');
    $('community-link').setAttribute('aria-label',fr('Profil','Profile'));
    $('community-link').title=fr('Profil','Profile');
    $('intro').hidden=Boolean(id||sportId);
    $('intro').textContent=kind==='challenge'
      ?fr('Cartes sportives obtenues après validation des courses.',
          'Sport cards earned from validated runs.')
      :fr('Séances musicales à découvrir, en durée ou en distance.',
          'Discover timed and distance-based musical workouts.');
    $('footer-privacy').setAttribute('aria-label',fr('Confidentialité','Privacy'));
    $('footer-privacy-label').textContent=fr('Confidentialité','Privacy');
    $('kind-label').textContent=fr('Type','Type');
    document.querySelector('#kind-filter option[value=workout]').textContent=
      fr('Séances musicales','Musical workouts');
    $('session-mode-label').textContent=fr('Objectif','Goal');
    document.querySelector('#session-mode-filter option[value=all]').textContent=
      fr('Toutes les séances','All workouts');
    document.querySelector('#session-mode-filter option[value=time]').textContent=
      fr('Durée','Time');
    document.querySelector('#session-mode-filter option[value=distance]').textContent=
      fr('Distance','Distance');
    document.querySelector('#kind-filter option[value=challenge]').textContent=fr('Défis','Challenges');
    $('sort-label').textContent=fr('Classement','Sort order');
    document.querySelector('#sort-filter option[value=recent]').textContent=fr('Récentes','Newest');
    document.querySelector('#sort-filter option[value=popular]').textContent=fr('Populaires','Popular');
    $('source-label').textContent=fr('Source','Source');
    document.querySelector('#source-filter option[value=all]').textContent=fr('Sources','Sources');
    $('distance-label').textContent=fr('Distance','Distance');
    document.querySelector('#distance-filter option[value=all]').textContent=
      fr('Toutes distances','All distances');
    $('difficulty-label').textContent=fr('Difficulté','Difficulty');
    const levels={all:['Toutes difficultés','All difficulties'],beginner:['Débutant','Beginner'],
      amateur:['Amateur','Amateur'],regular:['Régulier','Regular'],
      intermediate:['Intermédiaire','Intermediate'],expert:['Expert','Expert'],
      legend:['Légende','Legend'],world_elite:['Élite mondiale','World elite']};
    for(const [key,label] of Object.entries(levels))
      document.querySelector('#difficulty-filter option[value='+key+']').textContent=
        fr(label[0],label[1]);
    updateCatalogFilters();
    if(id||sportId)showDetail();else showList();
  }
  $('kind-filter').onchange=()=>{
    kind=$('kind-filter').value;page=1;
    updateCatalogFilters();showList();
    $('intro').textContent=kind==='challenge'
      ?fr('Cartes sportives obtenues après validation des courses.',
          'Sport cards earned from validated runs.')
      :fr('Séances musicales à découvrir, en durée ou en distance.',
          'Discover timed and distance-based musical workouts.');
  };
  $('session-mode-filter').onchange=()=>{
    musicGoal=$('session-mode-filter').value;page=1;showList();
  };
  $('sort-filter').onchange=()=>{
    sort=$('sort-filter').value;page=1;showList();
  };
  $('source-filter').onchange=()=>{
    musicSource=$('source-filter').value;
    page=1;
    showList();
  };
  $('distance-filter').onchange=()=>{
    sportDistance=$('distance-filter').value;
    sportSub='';
    $('sub-filter').value='';
    page=1;
    updateCatalogFilters();
    showList();
  };
  $('difficulty-filter').onchange=()=>{
    sportDifficulty=$('difficulty-filter').value;
    page=1;
    showList();
  };
  $('sub-filter').onchange=()=>{
    const value=$('sub-filter').value.trim();
    sportSub=/^[1-9][0-9]{0,5}$/.test(value)?value:'';
    $('sub-filter').value=sportSub;
    page=1;
    showList();
  };
  $('fr').onclick=()=>setLanguage('fr');
  $('en').onclick=()=>setLanguage('en');
  setLanguage(lang);
})();
</script>
</body>
</html>
