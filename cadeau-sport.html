<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Cadeau sportif · BeatOnStep</title>
<meta name="description" content="Un défi sportif BeatOnStep à découvrir et à accepter librement.">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/sport-card-face.css">
<style>
body{margin:0;min-height:100vh;background:#10100c;color:#eee;font-family:system-ui,Arial,sans-serif}
main{max-width:760px;margin:auto;padding:32px 19px 60px;text-align:center}
a{color:#fcea07}
.eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#d0c98e}
h1{font-size:clamp(28px,7vw,50px);line-height:1.1;margin:16px 0 28px}
.trophy{max-width:360px;margin:0 auto 28px;min-height:350px;display:flex;flex-direction:column;
align-items:center;justify-content:space-around;padding:25px 19px;border-radius:22px;
border:2px solid #d8c438;background:linear-gradient(135deg,#37321d,#1b1913 50%,#13120e)}
.trophy .icon{font-size:73px}
.trophy h2{font-size:27px;color:#fcea07;margin:8px 0}
.trophy small{color:#d4cba8;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.trophy p{font-size:14px}
p{line-height:1.6}
.status{margin:20px auto;min-height:46px;max-width:550px;color:#e2dfcc}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.actions a{display:inline-flex;align-items:center;justify-content:center;
min-height:45px;border-radius:23px;padding:10px 20px;font-size:15px;font-weight:800;
border:1px solid #fcea07;cursor:pointer;text-decoration:none}
.actions a.primary{background:#fcea07;color:#151509}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<p class="eyebrow">BeatOnStep · Défi sportif</p>
<h1>On t'offre une carte sportive !</h1>
<section class="trophy sport-gift-panel" aria-labelledby="card-title">
  <small>CARTE MONDIALE</small>
  <div id="card-face" class="sport-gift-face" aria-live="polite"></div>
  <h2 id="card-title">Défi à découvrir</h2>
  <p id="card-difficulty"></p>
  <small id="card-donor"></small>
</section>
<p id="status" class="status" role="status" aria-live="polite">Vérification du lien…</p>
<div class="actions" id="claim-actions" hidden>
  <a id="open-app" class="primary" href="beatonstep://">Ouvrir dans l’application</a>
</div>
</main>
<script src="/sport-card-face.js"></script>
<script src="/sport-card-percentile.js"></script>
<script>
(()=>{
  'use strict';
  const $=id=>document.getElementById(id);
  const code=new URLSearchParams(location.hash.slice(1)).get('gift')||'';
  const status=message=>{$('status').textContent=message};
  const valid=/^[a-f0-9]{64}$/.test(code);
  // Friendly SUB display never changes the world-card identifier.
  const displaySportName=name=>String(name||'').replace(
    /\bSUB\s+(\d+)\s+s\b/gi,(_,raw)=>{
      const seconds=Number(raw),minutes=Math.floor(seconds/60);
      const remainder=seconds%60;
      return 'SUB '+(minutes
        ?minutes+' min'+(remainder?' '+String(remainder).padStart(2,'0')+' s':'')
        :seconds+' s');
    });
  const api=async(path,body)=>{
    const response=await fetch(path,{
      method:'POST',credentials:'same-origin',cache:'no-store',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
    });
    const result=await response.json().catch(()=>({}));
    return {status:response.status,ok:response.ok,result};
  };
  const draw=async()=>{
    $('claim-actions').hidden=!valid;
    if(!valid){status('Ce lien est incomplet ou incorrect.');return}
    // Opening the app never claims a card; login and acceptance remain optional there.
    $('open-app').href='beatonstep://sport-gift?code='+encodeURIComponent(code);
    try{
      const {ok,result}=await api('/api/account/sport/gift/preview',{code});
      if(!ok||!result.card)throw Error('unavailable');
      const card=result.card;
      await BeatOnStepSportPercentiles.ready();
      $('card-title').textContent=displaySportName(card.name);
      $('card-face').replaceChildren(BeatOnStepSportCards.createFace(document,{
        title:displaySportName(card.name),distanceCm:card.distanceCm,
        difficulty:BeatOnStepSportPercentiles.visibleTier(card),
      },'fr'));
      $('card-difficulty').textContent=BeatOnStepSportPercentiles.label(card,'fr');
      $('card-donor').textContent=result.donorHandle
        ?'Offert par @'+result.donorHandle:'Cadeau d’un coureur BeatOnStep';
      if(result.available){
        status('Le cadeau est disponible. Ouvre-le dans BeatOnStep pour le découvrir.');
      }else{
        status(result.reason==='already_claimed'
          ?'Cette carte a déjà été offerte. Le lien reste visible comme souvenir.'
          :'Ce coureur ne possède plus cette carte. Le cadeau n’est plus transférable.');
      }
    }catch{status('Impossible de vérifier ce lien pour le moment. Réessaie en actualisant.')}
  };
  void draw();
})();
</script>
</body>
</html>
