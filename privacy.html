<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Politique de confidentialité — BeatOnStep</title>
  <link rel="canonical" href="https://rafa-create.github.io/beatonstep-website/privacy.html" />
  <meta property="og:title" content="Politique de confidentialité — BeatOnStep" />
  <meta property="og:description" content="Politique de confidentialité de l’application Android BeatOnStep." />
  <meta property="og:url" content="https://rafa-create.github.io/beatonstep-website/privacy.html" />
  <meta property="og:image" content="https://rafa-create.github.io/beatonstep-website/og-image.jpg" />
  <link rel="icon" href="logo-400.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
  <script>
    window.BOS_TITLES = {
      fr: "Politique de confidentialité — BeatOnStep",
      en: "Privacy policy — BeatOnStep"
    };
  </script>
  <script src="i18n.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand-row">
        <img src="logo-400.jpg" width="56" height="56" alt="BeatOnStep" />
        <p class="brand">BeatOnStep</p>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-set="fr">FR</button>
          <button type="button" data-set="en">EN</button>
        </div>
      </div>
      <p class="sub" data-fr>Politique de confidentialité</p>
      <p class="sub" data-en>Privacy policy</p>
      <p class="header-nav">
        <a data-fr data-keep-lang data-href="./" href="./">← Accueil</a>
        <a data-en data-keep-lang data-href="./" href="./">← Home</a>
      </p>
    </header>
    <p class="muted legal-note" data-en>The official policy is in French.</p>
    <main id="content"><p class="status">Chargement…</p></main>
    <footer>
      <a data-fr data-keep-lang data-href="./" href="./">Accueil</a>
      <a data-en data-keep-lang data-href="./" href="./">Home</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/rafa-create/beatonstep-website/discussions/1">Forum</a>
      <span aria-hidden="true">·</span>
      <a href="https://www.linkedin.com/company/beatonstep">LinkedIn</a>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    (function () {
      var el = document.getElementById("content");
      fetch("PRIVACY.md", { cache: "no-cache" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(function (md) {
          el.innerHTML = marked.parse(md);
        })
        .catch(function () {
          el.innerHTML =
            '<p class="status error">Impossible de charger la politique. ' +
            'Ouvrez <a href="PRIVACY.md">PRIVACY.md</a> directement.</p>';
        });
    })();
  </script>
</body>
</html>
