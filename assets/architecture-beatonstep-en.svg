<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">BeatOnStep — Architecture &amp; flow</title>
  <desc id="desc">In practice: GitHub stores the code, the VM coordinates, Expo builds and distributes, and the app calls the API and receives updates.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="95%">
      <stop offset="0" stop-color="#20201b"/>
      <stop offset="0.48" stop-color="#0f1110"/>
      <stop offset="1" stop-color="#050606"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22231f"/>
      <stop offset="1" stop-color="#101210"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#ffd74f"/>
      <stop offset="1" stop-color="#e9a91a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f7c938"/>
    </marker>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8e2d3"/>
    </marker>
  </defs>

