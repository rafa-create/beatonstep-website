      <text x="847" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#c9c2af"><tspan x="847" dy="0">Integration server</tspan></text>
      <text x="779" y="273" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#eee7d6"><tspan x="779" dy="0">• receives GitHub webhooks</tspan><tspan x="779" dy="26">• orchestrates builds and updates</tspan><tspan x="779" dy="26">• runs scripts and business APIs</tspan></text>
