      <text x="1179" y="273" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#eee7d6"><tspan x="1179" dy="0">• EAS Build for native builds</tspan><tspan x="1179" dy="26">• EAS Update for OTA</tspan><tspan x="1179" dy="26">• hosts and distributes bundles</tspan></text>
