    Beat<tspan fill="#f7c938">On</tspan>Step
  </text>
  <text x="750" y="96" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">Architecture &amp; flow</text>
  <text x="750" y="125" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#f2b928">GitHub · VM · Expo · business API · OTA · native builds</text>

  
