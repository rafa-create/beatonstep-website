      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <script>
    window.BOS_TITLES = {
      fr: "Crédits musicaux (Mix démo) — BeatOnStep",
      en: "Music credits (Demo mix) — BeatOnStep"

<body>

  <a class="skip-link" href="#content" data-en>Skip to content</a>

      <p data-fr>BeatOnStep — Android et iOS</p>
      <p data-en>BeatOnStep — Android and iOS</p>

  <div class="wrap">
    <header>
      <div class="brand-row">
        <img src="logo-400.jpg" width="56" height="56" alt="BeatOnStep" />
        <p class="brand">BeatOnStep</p>
        <div class="chrome">

              <span data-fr>Clair</span>
              <span data-en>Light</span>

            <button type="button" data-set="fr">FR</button>
            <button type="button" data-set="en">EN</button>
          </div>
        </div>

      <p class="sub" data-fr>Crédits musicaux (Mix démo)</p>
      <p class="sub" data-en>Music credits (Demo mix)</p>
      <p class="header-nav">
        <a data-fr data-keep-lang data-href="./" href="./">← Accueil</a>

      <a class="foot-link" data-fr data-keep-lang data-href="./" href="./">Accueil</a>

      </a>
    </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    (function () {
      var el = document.getElementById("content");
      function fileFor(lang) {
        return lang === "en" ? "MUSIC-CREDITS.en.md" : "MUSIC-CREDITS.fr.md";
      }
      function load(lang) {
        el.innerHTML = '<p class="status">' + (lang === "en" ? "Loading…" : "Chargement…") + "</p>";
        fetch(fileFor(lang), { cache: "no-cache" })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text();
          })
          .then(function (md) {
            el.innerHTML = marked.parse(md);
          })
          .catch(function () {
            el.innerHTML =
              '<p class="status error">' +
              (lang === "en"
                ? 'Could not load credits. Open <a href="MUSIC-CREDITS.en.md">MUSIC-CREDITS.en.md</a>.'
                : 'Impossible de charger les crédits. Ouvrez <a href="MUSIC-CREDITS.fr.md">MUSIC-CREDITS.fr.md</a>.') +
              "</p>";
          });
      }
      var start = document.documentElement.lang === "en" ? "en" : "fr";
      load(start);
      if (window.BOS_onLangChange) window.BOS_onLangChange(load);
    })();
  </script>
</body>
</html>
